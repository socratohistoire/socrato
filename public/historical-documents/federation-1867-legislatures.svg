<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc"><title id="title">Document 2 · Le Dominion du Canada en 1867</title><desc id="desc">Un Parlement fédéral et des législatures provinciales aux compétences réparties par la Constitution; Ontario et Québec remplacent les sections de la Province du Canada.</desc><style>text{font-family:Arial,sans-serif;fill:#163247;text-anchor:middle}.heading{font-size:30px;font-weight:bold}.label{font-size:23px;font-weight:bold}.body{font-size:20px}.note{font-size:17px}.box{fill:#fff;stroke:#45697c;stroke-width:2}.area{fill:#eef3f5;stroke:#9bb1bb;stroke-width:2}</style><rect width="1100" height="720" fill="#fffaf0"/><text x="550" y="52" class="heading">Document 2 · Le Dominion du Canada en 1867</text>
<rect x="45" y="90" width="490" height="515" rx="18" class="area"/><rect x="565" y="90" width="490" height="515" rx="18" class="area"/>
<text x="290" y="132" class="label">ORDRE FÉDÉRAL</text><text x="810" y="132" class="label">ORDRE PROVINCIAL</text>
<rect x="70" y="160" width="440" height="185" rx="14" class="box"/><text x="290" y="199" class="label">Parlement du Canada</text><text x="290" y="240" class="body">La Couronne</text><text x="290" y="276" class="body">Sénat</text><text x="290" y="312" class="body">Chambre des communes</text>
<text x="290" y="392" class="label">Exemples de compétences</text><text x="290" y="433" class="body">Défense · Monnaie · Poste</text><text x="290" y="510" class="body">Pour l’ensemble du Canada :</text><text x="290" y="548" class="body">Ontario, Québec, Nouveau-Brunswick</text><text x="290" y="580" class="body">et Nouvelle-Écosse</text>
<rect x="590" y="160" width="440" height="135" rx="14" class="box"/><text x="810" y="195" class="label">Législature de l’Ontario</text><text x="810" y="234" class="body">Lieutenant-gouverneur</text><text x="810" y="269" class="body">Assemblée législative</text>
<rect x="590" y="312" width="440" height="151" rx="14" class="box"/><text x="810" y="348" class="label">Législature du Québec</text><text x="810" y="382" class="body">Lieutenant-gouverneur</text><text x="810" y="414" class="body">Conseil législatif</text><text x="810" y="447" class="body">Assemblée législative</text>
<text x="810" y="499" class="label">Exemples de compétences</text><text x="810" y="532" class="body">Éducation* · Municipalités</text><text x="810" y="567" class="note">Le N.-B. et la N.-É. ont aussi leur législature.</text>
<text x="550" y="640" class="note">Les compétences des deux ordres sont réparties par la Constitution.</text>
<text x="550" y="672" class="note">Schéma pédagogique · Socrato · AANB, art. 6, 17, 69, 71, 88, 91–93.</text>
<text x="550" y="701" class="note">* Sous réserve des garanties constitutionnelles. Les gouvernements exécutifs ne sont pas détaillés.</text></svg>
