<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1140" viewBox="0 0 1500 1140" role="img" aria-labelledby="title desc"><title id="title">La structure politique du Dominion du Canada en 1867</title><desc id="desc">Institutions fédérales et provinciales, nominations, élections et gouvernement responsable. Le Québec illustre l’ordre provincial; les différences avec l’Ontario sont indiquées.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#755631"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#17344b;text-anchor:middle}.title{font-size:30px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:20px}.small{font-size:17px}.link{font-size:18px;font-weight:700;fill:#755631}.line{fill:none;stroke:#755631;stroke-width:2.5;marker-end:url(#arrow)}.confidence{stroke-dasharray:7 5;stroke:#3f7651}.panel{fill:#f1f4f4;stroke:#a4b3b9;stroke-width:2}</style>
<rect width="1500" height="1140" fill="#fffaf0"/><text x="750" y="42" class="title">Document 2 · La structure politique du Canada en 1867</text>
<rect x="30" y="170" width="700" height="720" rx="18" class="panel"/><rect x="770" y="170" width="700" height="720" rx="18" class="panel"/>
<text x="380" y="205" class="head">ORDRE FÉDÉRAL</text><text x="1120" y="205" class="head">ORDRE PROVINCIAL · EXEMPLE DU QUÉBEC</text><rect x="530" y="65" width="440" height="75" rx="12" fill="#faf4e4" stroke="#9c8f81" stroke-width="2"/><text x="750" y="97" class="head">Couronne britannique</text><text x="750" y="126" class="body">Reine Victoria</text><path d="M530 102H150V220H380V232" class="line"/><text x="287" y="151" class="link">nomme¹</text><rect x="175" y="235" width="410" height="106" rx="12" fill="#f6eff5" stroke="#9c8f81" stroke-width="2"/><text x="380" y="267" class="head">Gouverneur général</text><text x="380" y="296" class="body">Représente la Couronne</text><text x="380" y="323" class="body">Sanctionne ou réserve les lois</text><rect x="915" y="235" width="410" height="106" rx="12" fill="#f6eff5" stroke="#9c8f81" stroke-width="2"/><text x="1120" y="267" class="head">Lieutenant-gouverneur</text><text x="1120" y="296" class="body">Représente la Couronne</text><text x="1120" y="323" class="body">Sanctionne ou réserve les lois</text><path d="M585 275H915" class="line"/><rect x="601" y="247" width="298" height="25" fill="#fffaf0"/><text x="750" y="265" class="link">nomme en conseil² →</text><path d="M380 341V370H215V378M215 407V419" class="line"/><path d="M380 370H550V378M550 407V419" class="line"/><text x="215" y="399" class="small">nomination officielle³</text><text x="550" y="399" class="link">nomme⁴</text><rect x="55" y="422" width="320" height="122" rx="12" fill="#f6eff5" stroke="#9c8f81" stroke-width="2"/><text x="215" y="454" class="head">Cabinet fédéral</text><text x="215" y="480" class="body" font-weight="700">Le premier ministre</text><text x="215" y="505" class="body" font-weight="700">choisit ses ministres</text><text x="215" y="530" class="small">Ils dirigent le gouvernement</text><rect x="395" y="422" width="310" height="122" rx="12" fill="#fff" stroke="#9c8f81" stroke-width="2"/><text x="550" y="454" class="head">Sénat</text><text x="550" y="483" class="body">Membres nommés</text><text x="550" y="510" class="body">Étudient et votent les lois</text><path d="M215 544V552M215 610V628" class="line confidence"/><text x="215" y="575" class="small">doit conserver</text><text x="215" y="599" class="small">la confiance de ↓</text>
<path d="M550 544V552M550 610V628" class="line"/><text x="550" y="575" class="small">adopte les lois</text><text x="550" y="599" class="small">avec ↓</text><rect x="100" y="632" width="560" height="88" rx="12" fill="#eef6ef" stroke="#9c8f81" stroke-width="2"/><text x="380" y="664" class="head">Chambre des communes</text><text x="380" y="693" class="body">Députés élus · Votent les lois et les crédits</text><path d="M380 787V722" class="line"/><text x="450" y="759" class="link">élisent ↑</text><rect x="155" y="789" width="450" height="70" rx="12" fill="#eff5f8" stroke="#9c8f81" stroke-width="2"/><text x="380" y="821" class="head">Électeurs admissibles</text><path d="M1120 341V370H955V378M955 407V419" class="line"/><path d="M1120 370H1290V378M1290 407V419" class="line"/><text x="955" y="399" class="small">nomination officielle³</text><text x="1290" y="399" class="link">nomme</text><rect x="795" y="422" width="320" height="122" rx="12" fill="#f6eff5" stroke="#9c8f81" stroke-width="2"/><text x="955" y="454" class="head">Conseil exécutif</text><text x="955" y="480" class="body" font-weight="700">Le premier ministre</text><text x="955" y="505" class="body" font-weight="700">choisit ses ministres</text><text x="955" y="530" class="small">Ils dirigent le gouvernement</text><rect x="1135" y="422" width="310" height="122" rx="12" fill="#fff" stroke="#9c8f81" stroke-width="2"/><text x="1290" y="454" class="head">Conseil législatif</text><text x="1290" y="483" class="body">Membres nommés</text><text x="1290" y="510" class="body">Étudient et votent les lois</text><path d="M955 544V552M955 610V628" class="line confidence"/><text x="955" y="575" class="small">doit conserver</text><text x="955" y="599" class="small">la confiance de ↓</text>
<path d="M1290 544V552M1290 610V628" class="line"/><text x="1290" y="575" class="small">adopte les lois</text><text x="1290" y="599" class="small">avec ↓</text><rect x="840" y="632" width="560" height="88" rx="12" fill="#eef6ef" stroke="#9c8f81" stroke-width="2"/><text x="1120" y="664" class="head">Assemblée législative</text><text x="1120" y="693" class="body">Députés élus · Votent les lois et les crédits</text><path d="M1120 787V722" class="line"/><text x="1190" y="759" class="link">élisent ↑</text><rect x="895" y="789" width="450" height="70" rx="12" fill="#eff5f8" stroke="#9c8f81" stroke-width="2"/><text x="1120" y="821" class="head">Électeurs admissibles</text><text x="380" y="924" class="small">Parlement fédéral : Couronne + Sénat + Communes.</text><text x="1120" y="924" class="small">Législature du Québec : lieutenant-gouverneur + deux chambres.</text>
<text x="750" y="961" class="body">L’Ontario possède sa propre législature, mais sans Conseil législatif.</text>
<text x="750" y="990" class="small">Le Nouveau-Brunswick et la Nouvelle-Écosse ont aussi leurs institutions provinciales et deux chambres en 1867.</text>
<text x="750" y="1024" class="small">¹ Sur avis du gouvernement britannique. ² Avec l’avis du cabinet fédéral (AANB, art. 58).</text>
<text x="750" y="1051" class="small">³ Le gouverneur nomme officiellement le premier ministre et, sur sa recommandation, les ministres.</text>
<text x="750" y="1078" class="small">⁴ À la fondation, les premiers sénateurs sont désignés par la Reine dans la proclamation (art. 25 original).</text>
<text x="750" y="1107" class="small">Socrato · Schéma simplifié : compétences réparties par l’AANB; liens de confiance fondés sur les conventions.</text>
<text x="750" y="1131" class="small">Sources : AANB, art. 9–17, 24–25, 37, 55, 58, 63, 69–72, 88, 90–93; Chambre des communes.</text></svg>
