    <text x="47" y="353" font-size="17" font-weight="700" fill="#224f65">Lac Saint-Louis</text>
    <text x="47" y="374" font-size="15" fill="#224f65">Vers les Grands Lacs</text>
    <text x="756" y="198" font-size="20" font-weight="700">Port de Montréal</text>
    <path d="M835 208v88" stroke="#75654c" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="780" y="380" font-size="16" font-weight="700" fill="#224f65">Fleuve Saint-Laurent</text>
    <text x="780" y="401" font-size="15" fill="#224f65">Vers l’Atlantique</text>
