      <path d="M0 0 10 5 0 10z" fill="#28627c"/>
    </marker>
  </defs>
  <rect width="960" height="448" fill="#f8f3e7"/>
  <rect x="20" y="20" width="920" height="408" rx="8" fill="none" stroke="#bcb298"/>
  <g font-family="Arial, sans-serif" fill="#252c29">
