<svg xmlns="http://www.w3.org/2000/svg" width="960" height="448" viewBox="0 0 960 448" role="img" aria-labelledby="title description">
  <title id="title">Le canal de Lachine et ses manufactures vers 1890</title>
  <desc id="description">Carte schématique allant du lac Saint-Louis au port de Montréal, avec trois secteurs de manufactures le long du canal et des quais dans la portion proche du port.</desc>
